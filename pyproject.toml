[project]
name = "letorifighter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vctr-dng", email = "94930828+vctr-dng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torille",
]

[project.scripts]
letorifighter = "letorifighter:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torille = { path = "../ToriLLE", editable = true }

[tool.pyrefly]
search-path = ["../ToriLLE"]
# Optional dependency groups (torch, lerobot) are not installed by default.
ignore-missing-imports = ["torch", "torch.*", "lerobot", "lerobot.*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
vla = [
    "lerobot==0.4.4",
]
# Frozen-network opponents (`FrozenNetworkOpponent`); torch is imported lazily.
torch = [
    "torch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: drives the real Toribash game (needs Steam and a display); deselected by default"]
addopts = "-m 'not native'"
