[project]
name = "letorifighter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vctr-dng", email = "94930828+vctr-dng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torille",
]

[project.scripts]
letorifighter = "letorifighter:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torille = { path = "../ToriLLE", editable = true }

[tool.pyrefly]
search-path = ["../ToriLLE"]
# Optional dependency groups (torch, lerobot) are not installed by default.
ignore-missing-imports = ["torch", "torch.*", "lerobot", "lerobot.*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
vla = [
    "lerobot[smolvla,dataset,training]==0.6.1",
    "mlflow>=3",
    "pyyaml",
]
# Frozen-network opponents (`FrozenNetworkOpponent`); torch is imported lazily.
torch = [
    "torch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: drives the real Toribash game (needs Steam and a display); deselected by default"]
addopts = "-m 'not native'"

[tool.uv]
# lerobot 0.6.1 caps numpy<2.3 (no Python 3.14 wheels), torille needs >=2.5.4.
# The override is exercised by tests/test_lerobot_writer.py and the vla tests.
override-dependencies = ["numpy>=2.5.4"]
